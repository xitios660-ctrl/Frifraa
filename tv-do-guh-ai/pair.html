<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TV DO GUH AI - Pareamento</title><style>body{font:18px system-ui;background:#171029;color:white;max-width:500px;margin:35px auto;padding:20px}input,button{font:inherit;padding:15px;border-radius:12px;margin:5px 0}button{background:#7645ce;color:white;border:0}input{width:90%}.keys{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}small{color:#bbb}</style><h1>📺 TV DO GUH AI</h1><p>Abra o aplicativo na TCL, copie o código de seis números e digite abaixo.</p><input id="code" placeholder="Código da TV" inputmode="numeric" maxlength="6"><button onclick="pair()">Conectar TV</button><p id="status">Ainda não pareado.</p><div class="keys"><button onclick="send('HOME')">⌂ Início</button><button onclick="send('BACK')">↩ Voltar</button><button onclick="send('VOLUME_UP')">🔊 +</button><button onclick="send('VOLUME_DOWN')">🔉 −</button><button onclick="send('MUTE')">🔇 Mudo</button><button onclick="send('YOUTUBE')">▶ YouTube</button><button onclick="send('NETFLIX')">Netflix</button></div><p><small>Comandos só funcionam depois do pareamento. A TV precisa manter o aplicativo aberto. Recursos podem variar conforme o modelo.</small></p><script>const api='https://tv-do-guh-bridge.onrender.com';let token=sessionStorage.getItem('tvtoken');const status=document.getElementById('status');if(token)status.textContent='Sessão de controle disponível';async function pair(){try{const r=await fetch(api+'/pair',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:document.getElementById('code').value})});const j=await r.json();if(!r.ok)throw Error(j.error);token=j.token;sessionStorage.setItem('tvtoken',token);status.textContent='Pareamento confirmado';}catch(e){status.textContent='Não foi possível parear: '+e.message}}async function send(command){if(!token){status.textContent='Primeiro conecte a TV';return}try{const r=await fetch(api+'/command',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({command})});const j=await r.json();status.textContent=r.ok?'Comando enviado: '+command:'Falha: '+j.error}catch(e){status.textContent='Sem conexão com o servidor'}}</script></html>
